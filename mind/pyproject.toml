[tool.poetry]
name = "mind"
version = "0.1.0"
packages = [
    { include = "mind", from = "src" }
]
description = ""
authors = ["Taylor Hearn <hearntaylor@gmail.com>"]
readme = "README.md"

[[tool.poetry.source]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu121"
priority = "explicit"

[tool.poetry.dependencies]
python = "^3.11"
ipykernel = "^6.29.5"
torch = { version = "^2.2.0", source = "pytorch" }
sentence-transformers = "^3.0.1"
config = "^0.5.1"
pydantic = "^2.9.0"
rich = "^13.8.1"
json-repair = "^0.29.5"
google-api-python-client = "^2.149.0"
google-auth-httplib2 = "^0.2.0"
google-auth-oauthlib = "^1.2.1"
EZGmail = "^2024.8.13"
openai = "^1.12.0"
PerplexiPy = "^1.1.3"
aiofiles = "^24.1.0"
portpicker = "^1.6.0"
mcp = "^1.2.0"
fastmcp = "^0.4.1"
langgraph = ">=1.0.2"
langchain-core = ">=1.0.4"
langchain-openai = ">=0.3.0"
chromadb = "^1.5.0"
posthog = "<3.6.0"
langchain = "^1.0.5"

[tool.poetry.group.dev.dependencies]
nbstripout = "^0.8.1"
pytest = "^8.4.2"
pytest-asyncio = "^1.2.0"
ruff = "^0.14.1"
mypy = "^1.18.2"
pre-commit = "^4.3.0"
pytest-cov = "^7.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "B904",  # Allow raise without from inside except
    "B905",  # zip() without strict parameter (Python 3.10+ feature)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
no_implicit_optional = true

# Module resolution. The package is a namespace package (no src/mind/__init__.py) laid
# out as packages = [{ include = "mind", from = "src" }], while all internal imports are
# absolute `from mind.…`. Without mypy_path, `src` is on neither the search path nor the
# cwd, so explicit_package_bases picks `mind/` as the base and checks
# src/mind/interfaces/mcp/server.py as module `src.mind.interfaces.mcp.server`. The
# absolute imports then resolve to nothing, and ignore_missing_imports degrades them to
# Any rather than erroring - a check that passes by not looking. The editable install
# cannot rescue it either: there is no py.typed in this repo, so PEP 561 bars mypy from
# using it. Measured: adding mypy_path took the reported count from 20 errors in 10
# files to 41 in 12.
#
# $MYPY_CONFIG_FILE_DIR, not a bare "src": mypy resolves a relative mypy_path against the
# WORKING DIRECTORY, not against this file. A bare "src" would be the one key in this
# block that needs cwd to *be* mind/, rather than merely needing this file to be found.
# Nothing hits that today - config discovery is cwd-only too, so config-found implies
# cwd == mind/ - but `--config-file mind/pyproject.toml` from the root, or an editor
# integration passing the config path explicitly, splits the two apart. A mypy_path entry
# pointing at a nonexistent directory is dropped SILENTLY, with no warning, which lands
# straight back in the "passes by not looking" state this block exists to escape.
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"
explicit_package_bases = true

# Kept as it was when these lived as hook flags, so this change is about WHERE the
# settings live, not about retuning strictness. Revisit alongside NPC-1034: this is a
# real loosening, and the errors it hides are part of that cleanup's scope.
strict_optional = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
