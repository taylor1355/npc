name: Claude Auto Review

# ## Authentication (NPC-1150; ports npc-simulation NPC-953)
#
# This workflow authenticates with the Claude Max subscription via
# `CLAUDE_CODE_OAUTH_TOKEN`, falling back to `ANTHROPIC_API_KEY` only when the
# OAuth secret is absent. The two are NEVER both set to a non-empty value,
# because Claude Code's credential precedence puts `ANTHROPIC_API_KEY` ABOVE
# `CLAUDE_CODE_OAUTH_TOKEN` (https://code.claude.com/docs/en/authentication.md).
# Setting both would silently keep every run on API billing while the workflow
# looked migrated -- and this workflow runs on EVERY push to EVERY PR, so it is
# the bulk of the spend. The "Select Claude credential" step prints which path
# was chosen, so the billing question is answerable from the run log.
#
# ## Token lifetime -- no CI-visible expiry warning
#
# `claude setup-token` mints a token that lives ONE YEAR. Nothing in this
# workflow, the action, or GitHub warns as that date approaches: the token
# simply stops working and reviews start failing to authenticate. Re-mint with:
#
#     claude setup-token
#
# then update the repository secret `CLAUDE_CODE_OAUTH_TOKEN` under
# Settings -> Secrets and variables -> Actions.
#
# The token is ACCOUNT-scoped, not repo-scoped, so ONE value serves both this
# repo and emergent-npcs/npc-simulation. Re-minting rotates it for both, so both
# repo secrets must be updated together -- and the date below must be updated in
# both files, since neither repo can see the other's copy.
#
#     CLAUDE_CODE_OAUTH_TOKEN minted on: 2026-07-30   (expires ~2027-07-30; re-mint with
#     'claude setup-token' before then -- there is no CI-visible expiry warning)
#
# That date is the one recorded in npc-simulation's .github/workflows/claude-review.yml
# for the same token. If this repo's secret is set from a NEWLY minted token rather
# than the existing one, correct the date here.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  # Manual retrigger lever -- exists because trigger EVENTS can be dropped with no
  # run object left behind to detect. During the 2026-08-06 GitHub Actions outage
  # (hosted-runner acquisition failures), pushes to an open PR produced no runs at
  # all; on recovery nothing replays a dropped `synchronize`, so the only ways to
  # get the tip reviewed were an empty commit or a close/reopen, both of which
  # mutate PR state. `gh workflow run claude-review.yml -f pr_number=<N>` does not.
  # NOTE: dispatch resolves the workflow file from the DEFAULT branch, so this
  # trigger only becomes usable once this change is on main.
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review (the merge ref refs/pull/<N>/merge is checked out)"
        required: true
        type: string

# A review describes a snapshot. Once a newer push lands, the in-flight review's
# verdict describes code that no longer exists, so finishing it burns a full run
# to produce an answer nobody can act on. Cancel it and review the new tip.
# ci.yml already takes this position for PR runs; this matches it.
#
# `github.workflow` scopes the group to this workflow, so a CI run on the same PR
# is not cancelled by a push here.
# The `|| inputs.pr_number` half serves workflow_dispatch, where there is no
# `pull_request` payload; both spellings resolve to the same PR number, so a
# dispatch-triggered review and a push-triggered one share a group and the
# newer one still cancels the stale one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      actions: read
    steps:
      # fetch-depth stays at 1 deliberately. A checkout@v5 shallow fetch on a PR
      # creates exactly one ref (refs/remotes/pull/<N>/merge), so `origin/main`
      # does NOT exist and both `git diff origin/main...HEAD` and
      # `git show origin/main:<path>` fail with "fatal: invalid object name
      # 'origin/main'". The review prompt below uses `gh pr diff` for the diff and
      # `git show HEAD:<path>` for committed file content, neither of which needs
      # more history -- so deepening the fetch would cost clone time to enable
      # commands nothing asks for.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          # Empty on pull_request events (checkout's default already fetches the
          # PR merge ref). On workflow_dispatch there is no PR-derived default, so
          # point at the same merge ref explicitly -- the review must see the
          # PR-merged-into-base tree either way.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/merge', inputs.pr_number) || '' }}

      # Decide the credential BEFORE the action runs, and say so out loud.
      #
      # Only presence booleans cross into the step: `secrets.X != ''` evaluates
      # in the workflow expression context and yields the string "true"/"false",
      # so no credential value ever reaches this step's shell, log, or env.
      #
      # Secrets are unavailable in job-level `if:` and in `concurrency:`, but
      # they ARE available in step-level `env:`, which is why the selection
      # lives here rather than further up.
      - name: Select Claude credential
        id: auth
        env:
          OAUTH_PRESENT: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          API_KEY_PRESENT: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          set -euo pipefail
          if [ "$OAUTH_PRESENT" = "true" ]; then
            echo "mode=oauth" >> "$GITHUB_OUTPUT"
            echo "AUTH PATH: CLAUDE_CODE_OAUTH_TOKEN (Claude Max subscription)."
            echo "  Usage bills against the subscription, not the metered API."
            if [ "$API_KEY_PRESENT" = "true" ]; then
              echo "  NOTE: ANTHROPIC_API_KEY is also configured but is deliberately"
              echo "        NOT passed to the action -- it outranks the OAuth token and"
              echo "        would silently restore API billing."
            fi
          elif [ "$API_KEY_PRESENT" = "true" ]; then
            echo "mode=api_key" >> "$GITHUB_OUTPUT"
            echo "AUTH PATH: ANTHROPIC_API_KEY (metered API billing)."
            echo "  CLAUDE_CODE_OAUTH_TOKEN is not set, so this run is API-billed."
            echo "  To move billing onto the Max subscription, run 'claude setup-token'"
            echo "  and store the result as the CLAUDE_CODE_OAUTH_TOKEN repo secret."
          else
            echo "::error::No Claude credential configured. Set either CLAUDE_CODE_OAUTH_TOKEN (preferred) or ANTHROPIC_API_KEY as a repository secret."
            exit 1
          fi

      - uses: anthropics/claude-code-action@v1
        with:
          additional_permissions: |
            actions: read
          # Exactly one of these is non-empty, by construction: the OAuth secret
          # passes through as-is (empty when unset), and the API key is passed
          # only when the selection step above chose it. See the precedence note
          # at the top of this file for why "set both and let the action sort it
          # out" is not an option.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ steps.auth.outputs.mode == 'api_key' && secrets.ANTHROPIC_API_KEY || '' }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}

            You are reviewing a pull request for the NPC "Mind tier" repository: a
            Python MCP (Model Context Protocol) server providing LLM-based
            decision-making and memory for the Godot NPC simulation. The project
            conventions live in `mind/CLAUDE.md` (the Python package is rooted at
            `mind/src/mind/`, NOT the git root). Read it before reviewing.

            Review the diff against these standards. Post specific, actionable
            inline comments; do not restate the whole diff. Be concise and high-signal.

            ## Known state of THIS environment -- read before reporting anything as new

            **1. `origin/main` does not exist here.** The checkout is `fetch-depth: 1`
            and creates only `refs/remotes/pull/<N>/merge`, so
            `git diff origin/main...HEAD` and `git show origin/main:<path>` both
            fail with "fatal: invalid object name 'origin/main'". That is expected,
            not a repo problem -- use `gh pr diff`. `HEAD` is the PR-merged-into-base
            commit, i.e. what will actually land.

            **2. Review the COMMITTED state, not the working tree.** Use
            `git show HEAD:<path>` for a file's committed content and `gh pr diff`
            for the diff under review; `git status --short` tells you which paths
            are dirty or untracked in this checkout. Anything present only in the
            working tree is not part of the PR, so never quote it as evidence of
            what the PR contains.

            **3. You cannot run the test suite here.** `poetry run pytest` needs a
            full `poetry install` (torch, plus a HuggingFace model download), which
            this job deliberately does not perform -- that is what
            `.github/workflows/ci.yml` is for, and it runs on the same PR. For
            anything covered only by the tests, say plainly that you could not
            verify it; never imply you did. Check the CI job's conclusion via the
            `mcp__github_ci__*` tools rather than guessing.

            ## Python style and tooling
            - Code must satisfy ruff (config in `mind/pyproject.toml`): rules
              E, W, F, I (isort), B (bugbear), C4, UP (pyupgrade); line-length 100;
              double-quoted strings; spaces for indentation. Flag obvious ruff
              violations (unused imports, unsorted imports, mutable-default args,
              non-pyupgraded syntax, f-strings missing placeholders).
            - Type safety: the project uses Pydantic v2 models and mypy
              (`--ignore-missing-imports --no-strict-optional`). Prefer typed
              signatures and Pydantic models over raw dicts for structured data.
              Flag new public functions / Node methods that drop type annotations.
            - Follow the existing module layout: cognitive_architecture/ (pipeline,
              nodes, memory), interfaces/mcp/ (FastMCP server), apis/ (LLM clients).
              New processing nodes extend the Node / LLMNode base classes in
              `cognitive_architecture/nodes/base.py` and keep their prompt in a
              sibling `prompt.md`.

            ## Architecture
            - This is the Mind tier of a three-tier system (Controller -> Client ->
              Mind). It must stay free of Godot/engine dependencies and must not
              assume a particular simulation client.
            - The cognitive pipeline is a 4-step async LangGraph StateGraph:
              memory_query -> memory_retrieval -> cognitive_update ->
              action_selection (plus on-demand memory_consolidation). State flows
              through the `PipelineState` model. Flag changes that bypass the
              pipeline, mutate shared state unsafely, or break the node contract.
            - MCP surface (create_mind / decide_action / consolidate_memories /
              cleanup_mind and the mind:// resources): flag changes to tool
              signatures or returned shapes that would break the Godot client
              without a corresponding note, and ensure observation/action payloads
              stay serializable.
            - Memory: ChromaDB vector store with ID-based deduplication, importance
              scoring, recency decay, and a daily buffer consolidated on demand.
              Flag changes that could leak duplicates, drop importance/recency
              handling, or break consolidation.
            - LLM calls go through the OpenRouter-backed clients in `apis/`; flag
              hardcoded keys, missing async handling, or unbounded token usage.

            ## CI parity
            - `.github/workflows/ci.yml` and `.pre-commit-config.yaml` carry an
              explicit PARITY CONTRACT in ci.yml's header comment: every CI gate
              (ruff lint, ruff format, pytest) has a pre-commit counterpart, and a
              change to either surface must change the other. Flag a PR that edits
              one without the other, or that widens or narrows the pytest scope on
              only one side.

            ## Testing
            - Tests use pytest (`asyncio_mode = auto`), split into
              `mind/tests/unit/` and `mind/tests/integration/`; run via
              `poetry run pytest`. Test files are named `test_*.py`.
            - New behavior should add unit tests; bug fixes should add a regression
              test that fails before the fix. Flag new logic with no test coverage
              and bug-fix PRs with no regression test.
            - Prefer fast unit tests (the pre-commit hook runs `tests/unit`);
              reserve integration tests for MCP server / pipeline / ChromaDB
              boundaries.

            ## Hygiene
            - No secrets / API keys committed; configuration comes from the
              environment (e.g. OPENROUTER_API_KEY).
            - Notebooks are stripped by nbstripout - flag committed notebook outputs.
            - Keep docstrings and docs accurate; per
              `mind/docs/meta/style-guide.md`, docs should be concise and
              purpose-focused.

            ## Review style
            - **State what you verified and what you did not.** If a claim rests on
              reading rather than running, say so explicitly.
            - Prefix minor issues with `nit: `.
            - For revisions, verify previous comments were actually addressed -- by
              re-reading the cited lines with `git show HEAD:<path>`, not by
              trusting a "fixed" reply -- AND review the new code on its own merits.

            If the PR looks good, say so briefly and note anything worth a
            follow-up. Otherwise concentrate on correctness, the pipeline / MCP
            contracts, and missing tests.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),mcp__github_ci__get_ci_status,mcp__github_ci__get_workflow_run_details,mcp__github_ci__download_job_log,Bash(git show:*),Bash(git log:*),Bash(git status:*),Bash(git diff:*)"
