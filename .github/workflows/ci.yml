# CI for the mind Python project (NPC-1029).
#
# PARITY CONTRACT: every gate in this job (ruff lint, ruff format, pytest) has a
# pre-commit counterpart in .pre-commit-config.yaml at the repo root, and a
# change to either surface must change the other. The hooks REWRITE (ruff
# --fix, ruff-format) while this job only VERIFIES - local commits fix, CI
# gates.
#
# Pre-commit hooks that are deliberately LOCAL-ONLY (no gate here):
#   - trailing-whitespace, end-of-file-fixer, nbstripout: rewriting normalizers;
#     the maintained Python surface (mind/src, mind/tests) is already gated
#     here by `ruff format --check`, and the notebook/legacy trees they also
#     touch are outside CI's gated surface.
#   - check-yaml, check-added-large-files, check-merge-conflict: commit-time
#     hygiene on the developer's staged files; GitHub itself rejects
#     unparseable workflow YAML, and the other two guard the local commit, not
#     the merged tree.
#   - mypy: held at stage `manual` locally and absent here until its error
#     baseline is cleaned up - NPC-1034 tracks promoting it to both surfaces.
#
# Version authority: uv.lock is the ONLY authority for tool versions in this
# job - ruff and pytest run via `uv run --frozen`, so there is no third pin to
# drift (the ruff-pre-commit rev is kept in sync per the note in
# .pre-commit-config.yaml).
#
# Interpreter: uv is the single authority. It resolves, downloads if needed, and
# owns the environment, so there is no second interpreter for the venv and the
# tests to disagree about. `--python 3.12` is the pin (mind/pyproject.toml
# declares >=3.11,<3.13, and there is deliberately no .python-version file for
# uv to read); ruff's target-version = "py311" keeps the syntax floor honest.
# Actually TESTING the 3.11 floor would need a matrix, deferred from PR #22's
# review.
#
# Test scope: tests/unit plus the two integration files that run without live
# LLM credentials. The OpenRouter-live integration files are excluded from
# both surfaces: tests/integration/test_cognitive_pipeline.py and
# tests/integration/test_mcp_server.py - path-qualified because
# tests/unit/test_mcp_server.py (mocked) shares the basename and DOES run here.
#
# mind/src/mind/project_config.py reads credentials/api_keys.cfg (repo root) AT
# IMPORT TIME, and the import chain reaches it from unit tests - hence the stub
# step before pytest. Only the two keys indexed at import need to exist.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on PRs only: cancelling a main run would skip the
# cache-save post steps and leave main's latest status "cancelled" instead of
# a real conclusion.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mind
    steps:
      - uses: actions/checkout@v5

      # uv is PINNED to the version that generated mind/uv.lock, so CI and a
      # developer machine build the same environment from the same file. Raising
      # it is a deliberate act that pairs with re-running `uv lock`.
      #
      # `enable-cache` caches ~/.cache/uv keyed on the lock. That single cache
      # replaces the venv cache this job used to keep: uv materializes a venv
      # from its cache by hardlink, so caching the wheels is strictly better
      # than caching a 2.4 GB tree of copies of them.
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.8"
          enable-cache: true
          cache-dependency-glob: "mind/uv.lock"

      # A function of which embedding models the tests load (~90MB for
      # all-MiniLM-L6-v2). Its key uses run_id, which never hits exactly, so it
      # restores from the newest previous run and RE-SAVES every run - a model
      # change updates it instead of freezing it at the first snapshot forever.
      - name: Cache huggingface models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            hf-${{ runner.os }}-

      # `--frozen` everywhere below: install exactly what uv.lock records and
      # never re-resolve. A lock that does not match pyproject.toml then fails
      # the run instead of being silently repaired inside CI, which is the whole
      # point of committing it.
      #
      # No group flags: pyproject's `default-groups = ["dev", "cpu"]` installs
      # the dev tools and the CPU torch build. CI must never pull the CUDA
      # build - there is no GPU on the runner and it is roughly ten times the
      # download.
      - run: uv sync --frozen --python 3.12

      - name: Ruff lint
        run: uv run --frozen ruff check src tests

      - name: Ruff format
        run: uv run --frozen ruff format --check src tests

      - name: Stub credentials file (read at import time by project_config.py)
        run: |
          mkdir -p ../credentials
          printf "OPENROUTER_API_KEY: 'ci-dummy'\nPERPLEXITY_API_KEY: 'ci-dummy'\n" > ../credentials/api_keys.cfg

      - name: Tests (scope matches the pytest-unit pre-commit hook)
        run: uv run --frozen pytest tests/unit tests/integration/test_http_endpoints.py tests/integration/test_memory_retrieval.py -q
