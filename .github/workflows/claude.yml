name: Claude Code

# ## Authentication (ports npc-simulation claude.yml)
#
# This workflow authenticates with the Claude Max subscription via
# `CLAUDE_CODE_OAUTH_TOKEN`, falling back to `ANTHROPIC_API_KEY` only when the
# OAuth secret is absent. The two are NEVER both set to a non-empty value,
# because Claude Code's credential precedence puts `ANTHROPIC_API_KEY` ABOVE
# `CLAUDE_CODE_OAUTH_TOKEN` (https://code.claude.com/docs/en/authentication.md).
# Setting both would silently keep every run on API billing while the workflow
# looked migrated — the exact failure this selection logic exists to prevent.
# The "Select Claude credential" step below prints which path was chosen, so the
# billing question is answerable from the run log instead of by inference.
#
# ## Token lifetime — no CI-visible expiry warning
#
# `claude setup-token` mints a token that lives ONE YEAR. Nothing in this
# workflow, the action, or GitHub warns as that date approaches: the token
# simply stops working and runs start failing to authenticate. Re-mint with:
#
#     claude setup-token
#
# then update the repository secret `CLAUDE_CODE_OAUTH_TOKEN` under
# Settings -> Secrets and variables -> Actions.
#
#     CLAUDE_CODE_OAUTH_TOKEN minted on: 2026-07-30   (expires ~2027-07-30; re-mint with
#     'claude setup-token' before then -- there is no CI-visible expiry warning)
#     Expires roughly one year after that date.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

# Serialize mentions per issue/PR so two @claude requests on the same thread
# don't race each other's comments.
#
# `cancel-in-progress: false` here, deliberately unlike claude-review.yml. That
# workflow reviews a moving target, so an in-flight review of an older push is
# worthless once a newer push lands. Here each mention is a DISTINCT request
# from a human, and cancelling the first to serve the second would throw away
# an answer nobody chose to abandon.
#
# Caveat: GitHub's pending queue holds exactly one run per group, so three rapid
# mentions on one thread will drop the middle one — the third supersedes the
# second while the first is still running.
#
# `github.event.issue.number` covers issue_comment and issues;
# `github.event.pull_request.number` covers pull_request_review_comment and
# pull_request_review. Exactly one is populated per event, so `||` selects it.
# (Secrets are unavailable in `concurrency:`, but no secret is needed here.)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # A human mention may sit anywhere in the text. A bot (the agent App, which
    # allowed_bots below admits) must START with @claude, so an agent comment
    # that merely quotes the string, e.g. a skill's "don't post @claude ...",
    # does not start a run.
    if: |
      (github.event_name == 'issue_comment' && (
        (github.event.sender.type != 'Bot' && contains(github.event.comment.body, '@claude')) ||
        (github.event.sender.type == 'Bot' && startsWith(github.event.comment.body, '@claude')))) ||
      (github.event_name == 'pull_request_review_comment' && (
        (github.event.sender.type != 'Bot' && contains(github.event.comment.body, '@claude')) ||
        (github.event.sender.type == 'Bot' && startsWith(github.event.comment.body, '@claude')))) ||
      (github.event_name == 'pull_request_review' && (
        (github.event.sender.type != 'Bot' && contains(github.event.review.body, '@claude')) ||
        (github.event.sender.type == 'Bot' && startsWith(github.event.review.body, '@claude')))) ||
      (github.event_name == 'issues' && (
        (github.event.sender.type != 'Bot' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))) ||
        (github.event.sender.type == 'Bot' && (startsWith(github.event.issue.body, '@claude') || startsWith(github.event.issue.title, '@claude')))))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # Decide the credential BEFORE the action runs, and say so out loud.
      #
      # Only presence booleans cross into the step: `secrets.X != ''` evaluates
      # in the workflow expression context and yields the string "true"/"false",
      # so no credential value ever reaches this step's shell, log, or env.
      #
      # Secrets are unavailable in job-level `if:` and in `concurrency:`, but
      # they ARE available in step-level `env:`, which is why the selection
      # lives here rather than further up.
      - name: Select Claude credential
        id: auth
        env:
          OAUTH_PRESENT: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          API_KEY_PRESENT: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          set -euo pipefail
          if [ "$OAUTH_PRESENT" = "true" ]; then
            echo "mode=oauth" >> "$GITHUB_OUTPUT"
            echo "AUTH PATH: CLAUDE_CODE_OAUTH_TOKEN (Claude Max subscription)."
            echo "  Usage bills against the subscription, not the metered API."
            if [ "$API_KEY_PRESENT" = "true" ]; then
              echo "  NOTE: ANTHROPIC_API_KEY is also configured but is deliberately"
              echo "        NOT passed to the action -- it outranks the OAuth token and"
              echo "        would silently restore API billing."
            fi
          elif [ "$API_KEY_PRESENT" = "true" ]; then
            echo "mode=api_key" >> "$GITHUB_OUTPUT"
            echo "AUTH PATH: ANTHROPIC_API_KEY (metered API billing)."
            echo "  CLAUDE_CODE_OAUTH_TOKEN is not set, so this run is API-billed."
            echo "  To move billing onto the Max subscription, run 'claude setup-token'"
            echo "  and store the result as the CLAUDE_CODE_OAUTH_TOKEN repo secret."
          else
            echo "::error::No Claude credential configured. Set either CLAUDE_CODE_OAUTH_TOKEN (preferred) or ANTHROPIC_API_KEY as a repository secret."
            exit 1
          fi

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          additional_permissions: |
            actions: read
          # Agents comment as this App . The action refuses any non-User
          # actor not named here, so an agent's @claude would fail before the model
          # runs. Named rather than '*', which would let any App drive the prompt.
          allowed_bots: emergent-npcs-agent
          # Exactly one of these is non-empty, by construction: the OAuth secret
          # passes through as-is (empty when unset), and the API key is passed
          # only when the selection step above chose it. See the precedence note
          # at the top of this file for why "set both and let the action sort it
          # out" is not an option.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ steps.auth.outputs.mode == 'api_key' && secrets.ANTHROPIC_API_KEY || '' }}
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),mcp__github_ci__get_ci_status,mcp__github_ci__get_workflow_run_details,mcp__github_ci__download_job_log"
